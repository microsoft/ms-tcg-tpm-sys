name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  RUSTDOCFLAGS: -D warnings

jobs:
  rust:
    name: rust (${{ matrix.name }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: openssl (linux)
            runner: ubuntu-latest
            features: openssl,vendored
          - name: openssl (linux arm64)
            runner: ubuntu-24.04-arm
            features: openssl,vendored
          - name: openssl (windows)
            runner: windows-latest
            features: openssl,vendored
          - name: openssl (windows arm64)
            runner: windows-11-arm
            features: openssl,vendored
    steps:
      - name: Authenticate to Azure
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          allow-no-subscriptions: true

      - name: Get Azure DevOps access token
        id: azure_devops_token
        shell: bash
        run: |
          token="$(az account get-access-token \
            --resource 499b84ac-1321-427f-aa17-267ca6975798 \
            --query accessToken \
            --output tsv)"
          test -n "$token"
          echo "::add-mask::$token"
          printf 'token=%s\n' "$token" >> "$GITHUB_OUTPUT"

      - name: Checkout (with submodules)
        uses: actions/checkout@v5
        env:
          GIT_CONFIG_COUNT: 1
          GIT_CONFIG_KEY_0: http.https://microsoft@dev.azure.com/microsoft.extraheader
          GIT_CONFIG_VALUE_0: "AUTHORIZATION: bearer ${{ steps.azure_devops_token.outputs.token }}"
        with:
          submodules: recursive

      - name: Install Rust components
        run: rustup component add clippy rustfmt

      - name: Install build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake perl pkg-config

      - name: Install OpenSSL build dependencies
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install strawberryperl nasm --no-progress --yes
          "C:\Strawberry\perl\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          "C:\Program Files\NASM" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Set up MSVC
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Configure build tools
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Get-Command perl.exe -ErrorAction Stop
          Get-Command nasm.exe -ErrorAction Stop
          Get-Command cl.exe -ErrorAction Stop
          Get-Command nmake.exe -ErrorAction Stop
          $objcopy = (Get-Command llvm-objcopy.exe -ErrorAction Stop).Source
          "TCG_TPM_OBJCOPY=$objcopy" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: cargo fmt --check
        id: rustfmt
        continue-on-error: true
        run: cargo fmt --all --check

      - name: Clippy
        id: clippy
        continue-on-error: true
        run: cargo clippy --locked --workspace --all-targets --no-default-features --features ${{ matrix.features }}

      - name: Test
        id: test
        continue-on-error: true
        run: cargo test --locked --workspace --no-default-features --features ${{ matrix.features }}

      - name: Run test-harness (cold init)
        id: cold_init
        continue-on-error: true
        run: |
          cargo run --locked -p test-harness --no-default-features --features ${{ matrix.features }} -- ./ci-tpm.nvmem

      - name: Run test-harness (warm restore)
        id: warm_restore
        continue-on-error: true
        run: |
          cargo run --locked -p test-harness --no-default-features --features ${{ matrix.features }} -- ./ci-tpm.nvmem

      - name: Doc
        id: doc
        continue-on-error: true
        run: cargo doc --locked --workspace --no-deps --no-default-features --features ${{ matrix.features }}

      - name: Report and fail checks
        if: always()
        shell: bash
        env:
          RUSTFMT_OUTCOME: ${{ steps.rustfmt.outcome }}
          CLIPPY_OUTCOME: ${{ steps.clippy.outcome }}
          TEST_OUTCOME: ${{ steps.test.outcome }}
          COLD_INIT_OUTCOME: ${{ steps.cold_init.outcome }}
          WARM_RESTORE_OUTCOME: ${{ steps.warm_restore.outcome }}
          DOC_OUTCOME: ${{ steps.doc.outcome }}
        run: |
          failed=false

          report_failure() {
            local name="$1"
            local outcome="$2"
            if [[ "$outcome" == "failure" ]]; then
              echo "::warning title=$name failed::$name failed; see the step logs for details."
              printf -- '- **%s** failed; see the step logs for details.\n' "$name" >> "$GITHUB_STEP_SUMMARY"
              failed=true
            fi
          }

          report_failure "rustfmt" "$RUSTFMT_OUTCOME"
          report_failure "clippy" "$CLIPPY_OUTCOME"
          report_failure "unit tests" "$TEST_OUTCOME"
          report_failure "test-harness (cold init)" "$COLD_INIT_OUTCOME"
          report_failure "test-harness (warm restore)" "$WARM_RESTORE_OUTCOME"
          report_failure "documentation" "$DOC_OUTCOME"

          if [[ "$failed" == "true" ]]; then
            exit 1
          fi

  all-matrix-runs-pass:
    name: All matrix runs pass
    if: always()
    needs: rust
    runs-on: ubuntu-latest
    steps:
      - name: Require successful matrix
        env:
          MATRIX_RESULT: ${{ needs.rust.result }}
        run: test "$MATRIX_RESULT" = success
