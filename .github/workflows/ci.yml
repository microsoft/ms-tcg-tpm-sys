name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  RUSTDOCFLAGS: -D warnings
  OPENVMM_DEPS_VERSION: 0.3.0-183
  AZURE_TPM_COMMIT: 13cbd888d14bd3fbaa667c73be4dc0427552a33a
  AZURE_TPM_URL: https://microsoft@dev.azure.com/microsoft/TPM/_git/TPM-Internal

jobs:
  rust:
    name: ${{ matrix.backend }} ${{ matrix.tpm_source }}, ${{ matrix.os }} ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        backend: [openssl, symcrypt]
        tpm_source: [oss, azure]
        os: [linux, windows]
        arch: [x86_64, aarch64]
        exclude:
          # Someday...
          - backend: symcrypt
            tpm_source: oss
        include:
          - backend: openssl
            features: openssl,vendored
          - backend: symcrypt
            features: symcrypt
          - os: linux
            arch: x86_64
            runner: ubuntu-latest
          - os: linux
            arch: aarch64
            runner: ubuntu-24.04-arm
          - os: windows
            arch: x86_64
            runner: windows-latest
          - os: windows
            arch: aarch64
            runner: windows-11-arm
          # Our Symcrypt build is only available for Linux musl targets
          - os: linux
            arch: x86_64
            backend: symcrypt
            RUST_TARGET: x86_64-unknown-linux-musl
          - os: linux
            arch: aarch64
            backend: symcrypt
            RUST_TARGET: aarch64-unknown-linux-musl
    env:
      RUST_TARGET: ${{ matrix.RUST_TARGET || '' }}
      # Only consulted when building for the corresponding musl target. The TPM's
      # CMake enables CXX even though `Tpm_BuildOption_LibOnly` compiles only C,
      # so the C++ compiler just has to exist.
      CC_x86_64_unknown_linux_musl: musl-gcc
      CC_aarch64_unknown_linux_musl: musl-gcc
      CXX_x86_64_unknown_linux_musl: g++
      CXX_aarch64_unknown_linux_musl: g++
      CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER: musl-gcc
      CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER: musl-gcc
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Authenticate to Azure
        if: matrix.tpm_source == 'azure'
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          allow-no-subscriptions: true

      - name: Get Azure DevOps access token
        if: matrix.tpm_source == 'azure'
        id: azure_devops_token
        shell: bash
        run: |
          token="$(az account get-access-token \
            --resource 499b84ac-1321-427f-aa17-267ca6975798 \
            --query accessToken \
            --output tsv)"
          test -n "$token"
          echo "::add-mask::$token"
          printf 'token=%s\n' "$token" >> "$GITHUB_OUTPUT"

      - name: Checkout OSS TPM submodule
        if: matrix.tpm_source == 'oss'
        run: git submodule update --init --recursive

      - name: Checkout Azure TPM submodule
        if: matrix.tpm_source == 'azure'
        shell: bash
        env:
          GIT_CONFIG_COUNT: 1
          GIT_CONFIG_KEY_0: http.https://microsoft@dev.azure.com/microsoft.extraheader
          GIT_CONFIG_VALUE_0: "AUTHORIZATION: bearer ${{ steps.azure_devops_token.outputs.token }}"
        run: |
          git init --quiet TPM
          git -C TPM remote add origin "$AZURE_TPM_URL"
          git -C TPM fetch --depth=1 origin "$AZURE_TPM_COMMIT"
          git -C TPM checkout --detach FETCH_HEAD
          git -C TPM submodule update --init --recursive

      - name: Install Rust components
        run: rustup component add clippy rustfmt

      - name: Install Rust target
        if: env.RUST_TARGET != ''
        run: rustup target add ${{ env.RUST_TARGET }}

      - name: Install build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake perl pkg-config

      - name: Install musl build dependencies
        if: contains(env.RUST_TARGET, 'musl')
        run: sudo apt-get install -y musl-tools

      - name: Install OpenSSL build dependencies
        if: runner.os == 'Windows' && matrix.backend == 'openssl'
        shell: pwsh
        run: |
          choco install strawberryperl nasm --no-progress --yes
          "C:\Strawberry\perl\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          "C:\Program Files\NASM" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Set up MSVC
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0

      # Exports SYMCRYPT_INCLUDE_DIR and SYMCRYPT_LIB_DIR via $GITHUB_ENV.
      - name: Fetch SymCrypt
        if: matrix.backend == 'symcrypt'
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: ./scripts/fetch-symcrypt.sh --tag "$OPENVMM_DEPS_VERSION" --arch "${{ matrix.arch }}" --platform "${{ matrix.os }}"

      - name: cargo fmt --check
        id: rustfmt
        continue-on-error: true
        run: cargo fmt --all --check

      - name: Clippy
        id: clippy
        continue-on-error: true
        run: cargo clippy --locked ${{ env.RUST_TARGET && format('--target {0}', env.RUST_TARGET) || '' }} --workspace --all-targets --no-default-features --features ${{ matrix.features }}

      - name: Test
        id: test
        continue-on-error: true
        run: cargo test --locked ${{ env.RUST_TARGET && format('--target {0}', env.RUST_TARGET) || '' }} --workspace --no-default-features --features ${{ matrix.features }}

      - name: Run test-harness (cold init)
        id: cold_init
        continue-on-error: true
        run: |
          cargo run --locked ${{ env.RUST_TARGET && format('--target {0}', env.RUST_TARGET) || '' }} -p test-harness --no-default-features --features ${{ matrix.features }} -- ./ci-tpm.nvmem

      - name: Run test-harness (warm restore)
        id: warm_restore
        continue-on-error: true
        run: |
          cargo run --locked ${{ env.RUST_TARGET && format('--target {0}', env.RUST_TARGET) || '' }} -p test-harness --no-default-features --features ${{ matrix.features }} -- ./ci-tpm.nvmem

      - name: Doc
        id: doc
        continue-on-error: true
        run: cargo doc --locked ${{ env.RUST_TARGET && format('--target {0}', env.RUST_TARGET) || '' }} --workspace --no-deps --no-default-features --features ${{ matrix.features }}

      - name: Report and fail checks
        if: always()
        shell: bash
        env:
          RUSTFMT_OUTCOME: ${{ steps.rustfmt.outcome }}
          CLIPPY_OUTCOME: ${{ steps.clippy.outcome }}
          TEST_OUTCOME: ${{ steps.test.outcome }}
          COLD_INIT_OUTCOME: ${{ steps.cold_init.outcome }}
          WARM_RESTORE_OUTCOME: ${{ steps.warm_restore.outcome }}
          DOC_OUTCOME: ${{ steps.doc.outcome }}
        run: |
          failed=false

          report_failure() {
            local name="$1"
            local outcome="$2"
            if [[ "$outcome" == "failure" ]]; then
              echo "::warning title=$name failed::$name failed; see the step logs for details."
              printf -- '- **%s** failed; see the step logs for details.\n' "$name" >> "$GITHUB_STEP_SUMMARY"
              failed=true
            fi
          }

          report_failure "rustfmt" "$RUSTFMT_OUTCOME"
          report_failure "clippy" "$CLIPPY_OUTCOME"
          report_failure "unit tests" "$TEST_OUTCOME"
          report_failure "test-harness (cold init)" "$COLD_INIT_OUTCOME"
          report_failure "test-harness (warm restore)" "$WARM_RESTORE_OUTCOME"
          report_failure "documentation" "$DOC_OUTCOME"

          if [[ "$failed" == "true" ]]; then
            exit 1
          fi

  all-matrix-runs-pass:
    name: All matrix runs pass
    if: always()
    needs: rust
    runs-on: ubuntu-latest
    steps:
      - name: Require successful matrix
        env:
          MATRIX_RESULT: ${{ needs.rust.result }}
        run: test "$MATRIX_RESULT" = success
