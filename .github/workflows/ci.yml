name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write

env:
  CARGO_TERM_COLOR: always

jobs:
  rustfmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install rustfmt
        run: rustup component add rustfmt

      - name: cargo fmt --check
        run: cargo fmt --all --check

  clippy:
    name: clippy (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: openssl
            features: openssl,vendored
    steps:
      - name: Authenticate to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          allow-no-subscriptions: true

      - name: Get Azure DevOps access token
        id: azure_devops_token
        shell: bash
        run: |
          token="$(az account get-access-token \
            --resource 499b84ac-1321-427f-aa17-267ca6975798 \
            --query accessToken \
            --output tsv)"
          test -n "$token"
          echo "::add-mask::$token"
          printf 'token=%s\n' "$token" >> "$GITHUB_OUTPUT"

      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        env:
          GIT_CONFIG_COUNT: 1
          GIT_CONFIG_KEY_0: http.https://microsoft@dev.azure.com/microsoft.extraheader
          GIT_CONFIG_VALUE_0: "AUTHORIZATION: bearer ${{ steps.azure_devops_token.outputs.token }}"
        with:
          submodules: recursive

      - name: Install clippy
        run: rustup component add clippy

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake perl pkg-config

      - name: Clippy
        run: cargo clippy --locked --workspace --all-targets --no-default-features --features ${{ matrix.features }} -- -D warnings

  test:
    name: test (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: openssl
            features: openssl,vendored
    steps:
      - name: Authenticate to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          allow-no-subscriptions: true

      - name: Get Azure DevOps access token
        id: azure_devops_token
        shell: bash
        run: |
          token="$(az account get-access-token \
            --resource 499b84ac-1321-427f-aa17-267ca6975798 \
            --query accessToken \
            --output tsv)"
          test -n "$token"
          echo "::add-mask::$token"
          printf 'token=%s\n' "$token" >> "$GITHUB_OUTPUT"

      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        env:
          GIT_CONFIG_COUNT: 1
          GIT_CONFIG_KEY_0: http.https://microsoft@dev.azure.com/microsoft.extraheader
          GIT_CONFIG_VALUE_0: "AUTHORIZATION: bearer ${{ steps.azure_devops_token.outputs.token }}"
        with:
          submodules: recursive

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake perl pkg-config

      - name: Test
        run: cargo test --locked --workspace --no-default-features --features ${{ matrix.features }}

      - name: Run test-harness (cold init)
        run: |
          cargo run --locked -p test-harness --no-default-features --features ${{ matrix.features }} -- ./ci-tpm.nvmem

      - name: Run test-harness (warm restore)
        run: |
          cargo run --locked -p test-harness --no-default-features --features ${{ matrix.features }} -- ./ci-tpm.nvmem

  doc:
    name: doc (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: openssl
            features: openssl,vendored
    steps:
      - name: Authenticate to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          allow-no-subscriptions: true

      - name: Get Azure DevOps access token
        id: azure_devops_token
        shell: bash
        run: |
          token="$(az account get-access-token \
            --resource 499b84ac-1321-427f-aa17-267ca6975798 \
            --query accessToken \
            --output tsv)"
          test -n "$token"
          echo "::add-mask::$token"
          printf 'token=%s\n' "$token" >> "$GITHUB_OUTPUT"

      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        env:
          GIT_CONFIG_COUNT: 1
          GIT_CONFIG_KEY_0: http.https://microsoft@dev.azure.com/microsoft.extraheader
          GIT_CONFIG_VALUE_0: "AUTHORIZATION: bearer ${{ steps.azure_devops_token.outputs.token }}"
        with:
          submodules: recursive

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake perl pkg-config

      - name: Doc
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --locked --workspace --no-deps --no-default-features --features ${{ matrix.features }}
