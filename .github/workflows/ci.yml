name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  RUSTDOCFLAGS: -D warnings
  AZURE_TPM_COMMIT: f53b8997454ddf6a2e4586602852be81f3dbff33
  AZURE_TPM_URL: https://microsoft@dev.azure.com/microsoft/TPM/_git/TPM-Internal

jobs:
  rust:
    name: rust (${{ matrix.name }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: openssl (oss, linux)
            runner: ubuntu-latest
            features: openssl,vendored
            tpm_source: oss
          - name: openssl (oss, linux arm64)
            runner: ubuntu-24.04-arm
            features: openssl,vendored
            tpm_source: oss
          - name: openssl (oss, windows)
            runner: windows-latest
            features: openssl,vendored
            tpm_source: oss
          - name: openssl (oss, windows arm64)
            runner: windows-11-arm
            features: openssl,vendored
            tpm_source: oss
          - name: openssl (azure, linux)
            runner: ubuntu-latest
            features: openssl,vendored
            tpm_source: azure
          - name: openssl (azure, linux arm64)
            runner: ubuntu-24.04-arm
            features: openssl,vendored
            tpm_source: azure
          - name: openssl (azure, windows)
            runner: windows-latest
            features: openssl,vendored
            tpm_source: azure
          - name: openssl (azure, windows arm64)
            runner: windows-11-arm
            features: openssl,vendored
            tpm_source: azure
          # The prebuilt SymCrypt is a musl build
          - name: symcrypt (azure, linux)
            runner: ubuntu-latest
            features: symcrypt,vendored
            target: x86_64-unknown-linux-musl
            tpm_source: azure
          - name: symcrypt (azure, linux arm64)
            runner: ubuntu-24.04-arm
            features: symcrypt,vendored
            target: aarch64-unknown-linux-musl
            tpm_source: azure
    env:
      # Only consulted when building for the corresponding musl target. The TPM's
      # CMake enables CXX even though `Tpm_BuildOption_LibOnly` compiles only C,
      # so the C++ compiler just has to exist.
      CC_x86_64_unknown_linux_musl: musl-gcc
      CC_aarch64_unknown_linux_musl: musl-gcc
      CXX_x86_64_unknown_linux_musl: g++
      CXX_aarch64_unknown_linux_musl: g++
      CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER: musl-gcc
      CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER: musl-gcc
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Authenticate to Azure
        if: matrix.tpm_source == 'azure'
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          allow-no-subscriptions: true

      - name: Get Azure DevOps access token
        if: matrix.tpm_source == 'azure'
        id: azure_devops_token
        shell: bash
        run: |
          token="$(az account get-access-token \
            --resource 499b84ac-1321-427f-aa17-267ca6975798 \
            --query accessToken \
            --output tsv)"
          test -n "$token"
          echo "::add-mask::$token"
          printf 'token=%s\n' "$token" >> "$GITHUB_OUTPUT"

      - name: Checkout OSS TPM submodule
        if: matrix.tpm_source == 'oss'
        run: git submodule update --init --recursive

      - name: Checkout Azure TPM submodule
        if: matrix.tpm_source == 'azure'
        shell: bash
        env:
          GIT_CONFIG_COUNT: 1
          GIT_CONFIG_KEY_0: http.https://microsoft@dev.azure.com/microsoft.extraheader
          GIT_CONFIG_VALUE_0: "AUTHORIZATION: bearer ${{ steps.azure_devops_token.outputs.token }}"
        run: |
          git init --quiet TPM
          git -C TPM remote add origin "$AZURE_TPM_URL"
          git -C TPM fetch --depth=1 origin "$AZURE_TPM_COMMIT"
          git -C TPM checkout --detach FETCH_HEAD
          git -C TPM submodule update --init --recursive

      - name: Install Rust components
        run: rustup component add clippy rustfmt

      - name: Install Rust target
        if: matrix.target != ''
        run: rustup target add ${{ matrix.target }}

      - name: Install build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake perl pkg-config

      - name: Install musl build dependencies
        if: contains(matrix.target, 'musl')
        run: sudo apt-get install -y musl-tools

      - name: Install OpenSSL build dependencies
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install strawberryperl nasm --no-progress --yes
          "C:\Strawberry\perl\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          "C:\Program Files\NASM" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Set up MSVC
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      # Exports SYMCRYPT_INCLUDE_DIR and SYMCRYPT_LIB_DIR via $GITHUB_ENV.
      - name: Fetch SymCrypt
        if: contains(matrix.features, 'symcrypt')
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: ./scripts/fetch-symcrypt.sh

      - name: cargo fmt --check
        id: rustfmt
        continue-on-error: true
        run: cargo fmt --all --check

      - name: Clippy
        id: clippy
        continue-on-error: true
        run: cargo clippy --locked ${{ matrix.target && format('--target {0}', matrix.target) || '' }} --workspace --all-targets --no-default-features --features ${{ matrix.features }}

      - name: Test
        id: test
        continue-on-error: true
        run: cargo test --locked ${{ matrix.target && format('--target {0}', matrix.target) || '' }} --workspace --no-default-features --features ${{ matrix.features }}

      - name: Run test-harness (cold init)
        id: cold_init
        continue-on-error: true
        run: |
          cargo run --locked ${{ matrix.target && format('--target {0}', matrix.target) || '' }} -p test-harness --no-default-features --features ${{ matrix.features }} -- ./ci-tpm.nvmem

      - name: Run test-harness (warm restore)
        id: warm_restore
        continue-on-error: true
        run: |
          cargo run --locked ${{ matrix.target && format('--target {0}', matrix.target) || '' }} -p test-harness --no-default-features --features ${{ matrix.features }} -- ./ci-tpm.nvmem

      - name: Doc
        id: doc
        continue-on-error: true
        run: cargo doc --locked ${{ matrix.target && format('--target {0}', matrix.target) || '' }} --workspace --no-deps --no-default-features --features ${{ matrix.features }}

      - name: Report and fail checks
        if: always()
        shell: bash
        env:
          RUSTFMT_OUTCOME: ${{ steps.rustfmt.outcome }}
          CLIPPY_OUTCOME: ${{ steps.clippy.outcome }}
          TEST_OUTCOME: ${{ steps.test.outcome }}
          COLD_INIT_OUTCOME: ${{ steps.cold_init.outcome }}
          WARM_RESTORE_OUTCOME: ${{ steps.warm_restore.outcome }}
          DOC_OUTCOME: ${{ steps.doc.outcome }}
        run: |
          failed=false

          report_failure() {
            local name="$1"
            local outcome="$2"
            if [[ "$outcome" == "failure" ]]; then
              echo "::warning title=$name failed::$name failed; see the step logs for details."
              printf -- '- **%s** failed; see the step logs for details.\n' "$name" >> "$GITHUB_STEP_SUMMARY"
              failed=true
            fi
          }

          report_failure "rustfmt" "$RUSTFMT_OUTCOME"
          report_failure "clippy" "$CLIPPY_OUTCOME"
          report_failure "unit tests" "$TEST_OUTCOME"
          report_failure "test-harness (cold init)" "$COLD_INIT_OUTCOME"
          report_failure "test-harness (warm restore)" "$WARM_RESTORE_OUTCOME"
          report_failure "documentation" "$DOC_OUTCOME"

          if [[ "$failed" == "true" ]]; then
            exit 1
          fi

  all-matrix-runs-pass:
    name: All matrix runs pass
    if: always()
    needs: rust
    runs-on: ubuntu-latest
    steps:
      - name: Require successful matrix
        env:
          MATRIX_RESULT: ${{ needs.rust.result }}
        run: test "$MATRIX_RESULT" = success
